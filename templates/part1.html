  {% extends 'base.html' %}
{% load static %}
  {% block content %}
<div class="row">
    <!-- 左侧景点评分分布 -->
    <div class="col-xl-6 col-md-12">
        <div class="card">
            <div class="card-header">
                <h5>景点评分分布</h5>
                <span class="text-muted">使用扇形图展示不同评分的景点数量分布</span>
            </div>
            <div class="card-block">
                <div id="rating-chart" style="width: 100%; height: 500px;"></div>
            </div>
        </div>
    </div>
    
    <!-- 右侧各省景点平均评分 -->
    <div class="col-xl-6 col-md-12">
        <div class="card">
            <div class="card-header">
                <h5>各省景点平均评分</h5>
                <span class="text-muted">展示各省份景点的平均评分和数量</span>
            </div>
            <div class="card-block">
                <div id="province-rating-chart" style="width: 100%; height: 500px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>

var ratingData = {{ rating_data|safe }};

// 左侧饼图
var myChart = echarts.init(document.getElementById('rating-chart'));

// 定义颜色
var colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452'];

var option = {
    title: {
        text: '景点评分分布',
        left: 'center',
        textStyle: {
            fontSize: 18,
            fontWeight: 'bold',
            color: '#333'
        }
    },
    tooltip: {
        trigger: 'item',
        formatter: '{a} <br/>{b}: {c} ({d}%)',
        backgroundColor: 'rgba(255, 255, 255, 0.95)',
        borderColor: '#ddd',
        borderWidth: 1,
        textStyle: {
            color: '#333'
        }
    },
    legend: {
        show: false
    },
    series: [
        {
            name: '评分分布',
            type: 'pie',
            radius: ['40%', '70%'],
            center: ['50%', '55%'],
            data: ratingData,
            color: colors,
            emphasis: {
                itemStyle: {
                    shadowBlur: 15,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.6)'
                },
                label: {
                    show: false
                }
            },
            label: {
                show: false
            },
            labelLine: {
                show: false
            }
        }
    ]
};

myChart.setOption(option);

// 右侧各省景点平均评分图表
var provinceChart = echarts.init(document.getElementById('province-rating-chart'));

// 模拟省份数据
var provinceData = [
    {name: '上海', count: 119, rating: 4.5},
    {name: '江苏', count: 98, rating: 4.4},
    {name: '广东', count: 145, rating: 4.6},
    {name: '浙江', count: 132, rating: 4.7},
    {name: '四川', count: 128, rating: 4.5},
    {name: '北京', count: 115, rating: 4.6},
    {name: '湖北', count: 105, rating: 4.4},
    {name: '湖南', count: 95, rating: 4.3}
];

var provinceOption = {
    title: {
        text: '各省景点平均评分',
        left: 'center',
        textStyle: {
            fontSize: 18,
            fontWeight: 'bold',
            color: '#333'
        }
    },
    tooltip: {
        trigger: 'axis',
        axisPointer: {
            type: 'cross',
            crossStyle: {
                color: '#999'
            }
        },
        backgroundColor: 'rgba(255, 255, 255, 0.95)',
        borderColor: '#ddd',
        borderWidth: 1,
        textStyle: {
            color: '#333'
        }
    },
    legend: {
        data: ['景点数量', '平均评分'],
        top: 30,
        textStyle: {
            color: '#666'
        }
    },
    grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        containLabel: true
    },
    xAxis: [
        {
            type: 'category',
            data: provinceData.map(item => item.name),
            axisPointer: {
                type: 'shadow'
            },
            axisLabel: {
                color: '#666',
                interval: 0,
                rotate: 45
            },
            axisLine: {
                lineStyle: {
                    color: '#ddd'
                }
            },
            axisTick: {
                show: false
            }
        }
    ],
    yAxis: [
        {
            type: 'value',
            name: '景点数量',
            min: 0,
            max: 150,
            interval: 30,
            axisLabel: {
                formatter: '{value}个',
                color: '#666'
            },
            axisLine: {
                lineStyle: {
                    color: '#ddd'
                }
            },
            splitLine: {
                lineStyle: {
                    color: '#f0f0f0'
                }
            }
        },
        {
            type: 'value',
            name: '评分',
            min: 4.0,
            max: 5.0,
            interval: 0.1,
            axisLabel: {
                formatter: '{value}',
                color: '#666'
            },
            axisLine: {
                lineStyle: {
                    color: '#ddd'
                }
            },
            splitLine: {
                lineStyle: {
                    color: '#f0f0f0'
                }
            }
        }
    ],
    series: [
        {
            name: '景点数量',
            type: 'bar',
            data: provinceData.map(item => item.count),
            itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    {offset: 0, color: '#1890ff'},
                    {offset: 1, color: '#69c0ff'}
                ]),
                borderRadius: [4, 4, 0, 0]
            },
            barWidth: '40%',
            emphasis: {
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        {offset: 0, color: '#1890ff'},
                        {offset: 1, color: '#36cfc9'}
                    ])
                }
            }
        },
        {
            name: '平均评分',
            type: 'line',
            yAxisIndex: 1,
            data: provinceData.map(item => item.rating),
            itemStyle: {
                color: '#fa8c16'
            },
            lineStyle: {
                width: 3,
                color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    {offset: 0, color: '#fa8c16'},
                    {offset: 1, color: '#ffd666'}
                ])
            },
            symbol: 'circle',
            symbolSize: 8,
            emphasis: {
                symbol: 'circle',
                symbolSize: 12
            },
            markLine: {
                silent: true,
                lineStyle: {
                    color: '#999'
                },
                data: [
                    {type: 'average', name: '平均值'}
                ]
            }
        }
    ]
};

provinceChart.setOption(provinceOption);

// 响应式
window.addEventListener('resize', function() {
    myChart.resize();
    provinceChart.resize();
});
</script>
  {% endblock %}
